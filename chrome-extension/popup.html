<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>E5 WASM</title>
    <style>
      body { font-family: sans-serif; width: 380px; margin: 10px; }
      textarea { width: 100%; min-height: 80px; }
      button { margin-top: 8px; }
      pre { white-space: pre-wrap; font-size: 12px; max-height: 280px; overflow: auto; }
      .muted { color: #555; font-size: 12px; }
    </style>
  </head>
  <body>
    <h3>E5 Small v2 Embeddings</h3>
    <p class="muted">All inference runs locally inside this extension via WASM.</p>
    <textarea id="input">What is a good way to learn Rust for machine learning?</textarea>
    <button id="run">Generate embedding</button>
    <pre id="output">Loading...</pre>
    <script type="module" src="popup.js"></script>
  </body>
</html>
